# The whole product on one machine: the server, PostgreSQL and Redis. This is
# the default install. To run on MongoDB instead, use docker-compose.mongodb.yml
# (README.md, "Which database"). Redis is optional for the product; it is here
# so presence and the live feed behave the way they will in a deployment that
# has it.
#
# As it ships, nothing here is reachable from another machine: the server and
# Redis are published on this machine's loopback address only, and PostgreSQL
# is not published at all. The password and the session secret below are
# development values that anybody reading this repository has. README.md,
# "Before anybody else can reach it", says what to change first.
name: chokh

# The server and the one-shot migration are the same image, so the tables a
# release declares and the code that reads them cannot be of different
# versions.
x-chokh-image: &chokh-image
  build: .
  image: chokh:local

# The password is a development value: set POSTGRES_PASSWORD in your
# environment before the first `docker compose up`. It is written into a URL,
# so keep it to letters, digits, `-` and `_`, or percent-encode it. The image
# sets it when it first creates the volume and never again; to change it later,
# change the role's password in the database as well.
x-database-url: &database-url 'postgresql://chokh:${POSTGRES_PASSWORD:-chokh-development-only}@postgres:5432/chokh'

services:
  # Creates the tables and indexes this release declares, then exits. It runs
  # on every `up`, creates nothing the second time, and the server does not
  # start until it has exited with success: a server pointed at a database the
  # migration has not reached refuses to boot.
  migrate:
    <<: *chokh-image
    restart: 'no'
    command: ['node', 'packages/store-postgres/dist/migrate.js', '--apply']
    environment:
      DATABASE_URL: *database-url
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *chokh-image
    restart: unless-stopped
    # On this machine only. Put a TLS-terminating proxy in front and leave this
    # as it is, or set CHOKH_PUBLISH (for example to 0.0.0.0:4100) once the
    # secrets below are your own.
    ports:
      - '${CHOKH_PUBLISH:-127.0.0.1:4100}:4100'
    environment:
      HOST: 0.0.0.0
      PORT: '4100'
      LOG_LEVEL: info
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      # What the dashboard session cookie is signed with. The image runs with
      # NODE_ENV=production, which refuses to start without one, and the value below
      # is a placeholder so that `docker compose up` works on a laptop. It is not a
      # secret: anybody reading this repository has it. Set SESSION_SECRET in your
      # environment before this is reachable by anybody else, or every session cookie
      # it ever signs is forgeable.
      SESSION_SECRET: ${SESSION_SECRET:-a-development-only-session-secret-change-me}
      # Unset means POST /api/sso refuses every exchange, which is the right default.
      # Set it to the secret shared with whatever application mints the tokens.
      SSO_SECRET: ${SSO_SECRET:-}
      # Unset means the keyless DB-IP Lite database. Set it to a MaxMind
      # license key to read GeoLite2-City instead.
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      # Chokh Pro. The key turns the paid features on; the other four say where
      # alerts go and are read by packages/ee alone. All unset is a complete
      # install of the free product.
      CHOKH_LICENSE_KEY: ${CHOKH_LICENSE_KEY:-}
      CHOKH_SMTP_URL: ${CHOKH_SMTP_URL:-}
      CHOKH_BREVO_API_KEY: ${CHOKH_BREVO_API_KEY:-}
      CHOKH_MAIL_FROM: ${CHOKH_MAIL_FROM:-}
      CHOKH_TELEGRAM_BOT_TOKEN: ${CHOKH_TELEGRAM_BOT_TOKEN:-}
      CHOKH_PUBLIC_URL: ${CHOKH_PUBLIC_URL:-}
    volumes:
      - geo-data:/app/data/geo
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Not published, on purpose: only the two services above reach it, over the
  # network compose makes for them. To look inside:
  #   docker compose exec postgres psql -U chokh chokh
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chokh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chokh-development-only}
      POSTGRES_DB: chokh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the socket: while the image is creating a new volume it
      # runs a server that answers on the socket alone, and a check that
      # believed it would let the migration start a moment too early.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U chokh -d chokh']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  geo-data:
