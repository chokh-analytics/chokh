# Publishes @chokh/sdk-node, @chokh/react and @chokh/next to npm.
#
# Two ways in, and no other: a tag packages-v<version> (the three packages'
# versions must all equal it), or a manual run from the Actions tab. A manual
# run is a dry run unless its "dry_run" box is unticked: it builds, tests,
# packs and checks everything and shows what npm would get, and uploads
# nothing. A push to main never publishes.
#
# Publishing needs the repository secret NPM_TOKEN, an npm granular access
# token that may publish under the @chokh scope. Each package is published
# with provenance (the id-token permission below), so npm shows which commit
# and which run built it. A version already on npm is passed over, so a run
# that failed halfway can simply be run again.
#
# Two jobs, so that what can publish runs nothing it did not have to. The
# build job installs the dependencies, builds, tests, packs and checks, and
# can mint no token: it holds `contents: read` and nothing else, so nothing
# a dependency runs during the install or the tests can ask for the OIDC
# token or see NPM_TOKEN. It hands the checked tarballs on as an artifact.
# The publish job takes those tarballs and nothing else: no checkout, no
# install, no build, only npm. It alone holds `id-token: write`, and it
# alone is given the secret.
#
# Every action is named by the commit it is at, not by a tag a maintainer
# (or somebody who took over their account) can move to other code. The
# version each commit is is said beside it. To move one on, read the new
# version's commit on that action's releases page and change both.
name: Release packages

on:
  push:
    tags: ['packages-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test, pack and check, and publish nothing'
        type: boolean
        default: true

# Nothing by default. Each job says what it needs.
permissions: {}

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  build:
    name: build, test, pack and check the three packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The runner sets ACTIONS_ID_TOKEN_REQUEST_URL only in a job that may
      # mint an OIDC token. This one must not be able to, since it runs the
      # dependencies' own code; if a change to the permissions above ever
      # gives it that, the release stops here.
      - name: This job cannot mint a token
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The build job can mint an OIDC token, and must not"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: The packages carry the tag's version
        if: github.event_name == 'push'
        run: |
          set -e
          want="${GITHUB_REF_NAME#packages-v}"
          for dir in packages/sdk-node packages/react packages/next; do
            have="$(node -p "require('./${dir}/package.json').version")"
            if [ "${have}" != "${want}" ]; then
              echo "::error::${dir} is ${have}, the tag says ${want}"
              exit 1
            fi
          done

      # The real server is what the SDK and the collect route are tested
      # against, so everything is built.
      - run: pnpm build

      - run: >-
          pnpm --filter @chokh/sdk-node --filter @chokh/react
          --filter @chokh/react-on-react-18 --filter @chokh/next test

      - run: pnpm size:packages

      # Packs each package, checks each tarball and loads it from a throwaway
      # consumer. --keep leaves the tarballs for the job below, so what is
      # published is exactly what was checked.
      - run: node scripts/pack-check.mjs --keep

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: .pack-check/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the checked tarballs, or show what would be published
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Node for npm, and the registry's address written where npm reads the
      # token from. No checkout and no install: nothing of this repository's
      # dependencies runs in a job that can publish.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # Provenance is signed with the token this job may mint.
      - name: This job can mint a token
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The publish job cannot mint an OIDC token, so npm could not sign provenance"
            exit 1
          fi

      - name: Publish, or show what would be published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -e
          if [ "${DRY_RUN}" != "true" ] && [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The repository secret NPM_TOKEN is not set, so nothing can be published"
            exit 1
          fi
          # @chokh/react before @chokh/next, which depends on it.
          for name in sdk-node react next; do
            # A path that starts with ./, or npm reads tarballs/x.tgz as a
            # GitHub repository named by its owner and name.
            tarball="$(ls ./tarballs/chokh-${name}-*.tgz)"
            version="$(tar -xOzf "${tarball}" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            if npm view "@chokh/${name}@${version}" version > /dev/null 2>&1; then
              echo "@chokh/${name}@${version} is already on npm, passed over"
              continue
            fi
            if [ "${DRY_RUN}" = "true" ]; then
              npm publish "${tarball}" --access public --dry-run
            else
              npm publish "${tarball}" --access public --provenance
            fi
          done
