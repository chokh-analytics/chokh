name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, typecheck, lint, test, tracker size
    runs-on: ubuntu-latest

    # Presence is a Redis sorted set when a deployment has Redis and a map when
    # it does not, and both back the same product, so both pass the same
    # presence suite. A stand-in for Redis would only prove the stand-in agrees
    # with itself, so the suite runs against a real one here; a laptop without
    # REDIS_URL skips it and says so.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The Postgres adapter is proved against the image people deploy, the
      # compose default, for the reason Redis is: a stand-in would only prove
      # the stand-in. A laptop without CHOKH_TEST_DATABASE_URL starts the
      # PostgreSQL that embedded-postgres brought with pnpm install instead.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      CHOKH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The store conformance suite runs on a downloaded mongod, so no runner
      # and no laptop needs Docker to prove an adapter. Cached because it is
      # about 600 MB and it never changes between runs. The path is where
      # mongodb-memory-server actually writes it under pnpm; the old
      # node_modules/.cache path was never written, so every run downloaded cold.
      - name: Cache the mongod the conformance suite runs on
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-7.0.24

      - run: pnpm install --frozen-lockfile

      # Fetched once, here, before four test files start at the same moment and
      # race for one lockfile on a cold cache, which failed runs of AN-PPL02 at
      # the download before any test ran. A no-op when the cache restored it.
      - name: Fetch mongod once
        working-directory: packages/store-mongo
        run: >-
          node -e "import('mongodb-memory-server').then(async ({ MongoBinary }) =>
          console.log(await MongoBinary.getPath()))"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      # The command an operator runs, against a real PostgreSQL: apply, verify,
      # and apply again to show the second run finds nothing left to create.
      - name: The Postgres migration applies, verifies and is safe to run twice
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -e
          node packages/store-postgres/dist/migrate.js --apply
          report="$(node packages/store-postgres/dist/migrate.js --verify-only)"
          echo "${report}"
          echo "${report}" | grep -q 'missing: 0, unexpected: 0'
          again="$(node packages/store-postgres/dist/migrate.js --apply)"
          echo "${again}"
          if echo "${again}" | grep -Eq '(tables|columns|indexes|partitions) created'; then
            echo "a second apply created something"
            exit 1
          fi

      # The built server as a process, against the PostgreSQL the step above
      # migrated: what it refuses to boot on, a pageview in and out again, and
      # how it stops. A process and not a test, because the signal, the exit
      # status and the first lines it writes are the things being proved, and
      # none of them exists inside a test runner. Last of the steps that need
      # the database, because it ends by taking the database away.
      - name: The server boots on PostgreSQL, refuses what it should, and stops when told
        env:
          NODE_ENV: production
          SESSION_SECRET: a-secret-long-enough-for-a-ci-run-0000
          COOKIE_SECURE: 'false'
          LOG_LEVEL: info
          PORT: '4190'
        run: |
          set -e
          url=postgresql://postgres:postgres@localhost:5432/postgres
          server=packages/server/dist/server.js
          postgres="$(docker ps -q --filter ancestor=postgres:17-alpine)"

          # Each of these must exit by itself, not zero, and say why. The limit
          # is there so a server that boots after all fails the step in twenty
          # seconds instead of holding the job.
          refused() {
            local name="$1" expected="$2"
            shift 2
            if out="$(env "$@" timeout 20 node "${server}" 2>&1)"; then
              echo "the server booted with ${name}"
              exit 1
            fi
            echo "${name}: $(grep -m1 "${expected}" <<< "${out}" || tail -n 5 <<< "${out}")"
            grep -q "${expected}" <<< "${out}"
          }
          refused 'both databases named' 'MONGODB_URI and DATABASE_URL are both set' \
            MONGODB_URI=mongodb://localhost:1/chokh DATABASE_URL="${url}"
          refused 'no database named' 'Neither MONGODB_URI nor DATABASE_URL is set'
          docker exec "${postgres}" psql -U postgres -q -c 'CREATE DATABASE chokh_empty'
          refused 'a database nobody migrated' 'migrate.js --apply' \
            DATABASE_URL="${url%/postgres}/chokh_empty"
          refused 'a database that is not there' 'could not open its database: .*ECONNREFUSED' \
            DATABASE_URL=postgresql://postgres:postgres@localhost:1/postgres

          boot() {
            DATABASE_URL="${url}" node "${server}" > server.log 2>&1 &
            pid=$!
            for attempt in $(seq 1 60); do
              if curl -fs http://localhost:4190/health > /dev/null; then return 0; fi
              sleep 1
            done
            cat server.log
            return 1
          }
          boot
          grep -q '"store":"postgres"' server.log

          curl -fs -c jar -X POST http://localhost:4190/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"a-long-enough-password"}' > /dev/null
          curl -fs -b jar -X POST http://localhost:4190/api/sites \
            -H 'content-type: application/json' \
            -d '{"id":"ci_site","name":"CI","domains":["example.com"],"settings":{"timezone":"Asia/Dhaka"}}' > /dev/null
          now="$(($(date +%s) * 1000))"
          # As a browser says it is. Sent as curl, the pageview is stored and
          # marked as a bot, which is right, and no report counts it.
          curl -fs -X POST http://localhost:4190/api/collect \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' \
            -H 'content-type: text/plain' -H 'origin: https://example.com' \
            -d "{\"siteId\":\"ci_site\",\"sentAt\":${now},\"hostname\":\"example.com\",\"visitorId\":\"v_ci\",\"lang\":\"en\",\"screen\":\"1440x900\",\"events\":[{\"type\":\"pageview\",\"ts\":$((now - 1000)),\"path\":\"/pricing\"}]}"
          read_back() {
            curl -fs -b jar "http://localhost:4190/api/sites/ci_site/stats/aggregate?from=$((now - 3600000))&to=$((now + 60000))"
          }
          answer="$(read_back)"
          echo "${answer}"
          grep -q '"pageviews":1' <<< "${answer}"

          # Told to stop with the database there. It exits by itself and with
          # zero: killed by the signal instead, the status would be 143.
          kill -TERM "${pid}"
          wait "${pid}"
          echo "stopped cleanly with the database present"

          # What it wrote is there for the next process.
          boot
          answer="$(read_back)"
          grep -q '"pageviews":1' <<< "${answer}"

          # Told to stop with the database gone. It still exits, and with zero.
          docker stop "${postgres}" > /dev/null
          kill -TERM "${pid}"
          if ! timeout 30 tail --pid="${pid}" -f /dev/null; then
            echo "still running thirty seconds after SIGTERM with the database gone"
            cat server.log
            exit 1
          fi
          wait "${pid}"
          echo "stopped cleanly with the database gone"

      - run: pnpm size:tracker

      # The dashboard is the first screenshot a developer sees and the first
      # thing they wait for. Its budgets are one per group of emitted files
      # (the entry chunk, the vendor chunk, the map, the routes together) and
      # gzipped, set from what the build weighed rather than from a guess, and
      # the fonts count because a product that self hosts them has to be honest
      # about carrying them.
      - run: pnpm size:dashboard

      # The line between the MIT core and packages/ee. ESLint already refuses a
      # core file that imports the paid half; this also covers the licence key
      # and the dependency direction, and runs even when lint did not.
      - run: node scripts/ee-boundary.mjs

      # A check that has never refused anything is a check nobody knows the
      # shape of. Both crossings are injected here and the script has to fail on
      # each, because the day it stops working is the day a paid feature is
      # given away under MIT and nobody notices for a release.
      - name: The boundary check refuses a crossing
        run: |
          set -e
          echo "const key = process.env.CHOKH_LICENSE_KEY;" >> packages/server/src/app.ts
          if node scripts/ee-boundary.mjs; then
            echo "the boundary check passed a core file reading the licence key"
            exit 1
          fi
          git checkout -- packages/server/src/app.ts

          printf "import { extension } from '@chokh/ee';\nexport const crossing = extension;\n" \
            > packages/server/src/crossing-probe.ts
          if node scripts/ee-boundary.mjs; then
            echo "the boundary check passed a core file importing packages/ee"
            exit 1
          fi
          rm packages/server/src/crossing-probe.ts

          node scripts/ee-boundary.mjs

      # Rule 3 again, for the driver: only packages/store-postgres imports pg.
      # Injected the same way and for the same reason, in the server, in the
      # paid half and in a script, and then the adapter itself is linted to
      # show the rule lets through the one place it should.
      - name: The lint rule refuses the PostgreSQL driver outside its adapter
        run: |
          set -e
          for file in packages/server/src/pg-probe.ts packages/ee/src/pg-probe.ts scripts/pg-probe.mjs; do
            printf "import pg from 'pg';\nexport const probe = pg;\n" > "${file}"
            if said="$(pnpm exec eslint "${file}" 2>&1)"; then
              echo "lint passed ${file} importing pg"
              exit 1
            fi
            rm "${file}"
            # Refused, and by this rule: a file lint cannot parse fails too.
            if ! grep -q 'no-restricted-imports' <<< "${said}"; then
              echo "lint failed ${file} for another reason:"
              echo "${said}"
              exit 1
            fi
            echo "refused: ${file}"
          done
          pnpm exec eslint packages/store-postgres/src/db.ts

      # The same, for the CLA. It runs here on every push rather than only on
      # the day a stranger opens a pull request, so the check is known to work
      # before anybody's patch is waiting on it.
      - run: node scripts/cla-check.mjs --dry-run

      # The shipped binary, not the function behind it. A pair is generated in
      # the runner and thrown away with it: the product's own private key exists
      # on the founder's machine and in no repository, image or CI secret.
      - name: chokh-license mints a key its own verifier accepts
        run: |
          set -e
          node packages/ee/dist/cli/chokh-license.js keygen --out "${RUNNER_TEMP}/pair"
          public="$(node packages/ee/dist/cli/chokh-license.js keygen --out "${RUNNER_TEMP}/second" | sed -n "s/^  '\(.*\)',$/\1/p")"
          key="$(node packages/ee/dist/cli/chokh-license.js mint \
            --key "${RUNNER_TEMP}/second/chokh-license.key" \
            --licensee "A CI Pair, Thrown Away" --features '*' --days 1)"
          node packages/ee/dist/cli/chokh-license.js verify "${key}" --public-key "${public}"
          # And the same key against a public key it was not signed for.
          stranger="$(node packages/ee/dist/cli/chokh-license.js keygen --out "${RUNNER_TEMP}/third" | sed -n "s/^  '\(.*\)',$/\1/p")"
          if node packages/ee/dist/cli/chokh-license.js verify "${key}" --public-key "${stranger}"; then
            echo "a key verified against an issuer that did not sign it"
            exit 1
          fi

  postgres-floor:
    name: the Postgres adapter on PostgreSQL 15, the oldest it supports
    runs-on: ubuntu-latest

    # The README promises PostgreSQL 15 or newer. The job above proves the
    # version the compose file runs; this one proves the promise, with the same
    # tests and the same migration against the oldest server it covers.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CHOKH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The adapter and what it is written against, nothing else.
      - run: pnpm --filter @chokh/store-postgres... build

      - run: pnpm --filter @chokh/store-postgres test

      - name: The migration applies, verifies and is safe to run twice
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -e
          node packages/store-postgres/dist/migrate.js --apply
          report="$(node packages/store-postgres/dist/migrate.js --verify-only)"
          echo "${report}"
          echo "${report}" | grep -q 'missing: 0, unexpected: 0'
          echo "${report}" | grep -q 'PostgreSQL 15'
          again="$(node packages/store-postgres/dist/migrate.js --apply)"
          echo "${again}"
          if echo "${again}" | grep -Eq '(tables|columns|indexes|partitions) created'; then
            echo "a second apply created something"
            exit 1
          fi

  core-only:
    name: the core builds and boots with packages/ee deleted
    runs-on: ubuntu-latest

    # "The core is MIT and free to self-host in full" is a promise, and this is
    # the only thing that makes it checkable. Delete the paid directory, drop
    # nothing else, install, build, boot, and read the two answers that say the
    # product is whole: health, and a licence route that admits there is no
    # licence.
    #
    # It is a job of its own because it mutates the checkout, and because when
    # it fails the answer is never "add a flag": it means the core grew a
    # dependency on the half that is not free.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Delete the paid half
        run: rm -rf packages/ee

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build

      - run: pnpm --filter @chokh/server test

      - name: Boot it, and read what it says about a licence it does not have
        run: |
          set -e
          SESSION_SECRET=a-secret-long-enough-for-a-ci-run-0000 \
          LOG_LEVEL=error PORT=4177 \
            node packages/server/dist/server.js &
          server=$!
          for attempt in $(seq 1 60); do
            if curl -fs http://127.0.0.1:4177/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fs http://127.0.0.1:4177/health | tee /dev/stderr | grep -q '"success":true'
          # Unauthenticated, so this is the 401 ruling 1 asks for rather than the
          # status itself. The licensee and the expiry are not for strangers.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4177/api/license)"
          echo "GET /api/license without a session: ${code}"
          [ "${code}" = "401" ]
          kill "${server}"

  cla:
    name: every contributor has signed the CLA
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    # pull_request and never pull_request_target. A fork's pull request has to
    # run with a read-only token and no secrets: pull_request_target on
    # unreviewed code from a stranger is how a repository gets taken over, and a
    # small trusted job like this one is exactly what somebody would reach for it
    # to write.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/cla-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tracker-e2e:
    name: tracker smoke in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @chokh/tracker build

      - run: pnpm --filter @chokh/tracker exec playwright install --with-deps chromium

      - run: pnpm --filter @chokh/tracker test:e2e

  react-e2e:
    name: '@chokh/react with the real tracker in a real browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The fixture serves the real a.js, so the tracker is built first.
      - run: pnpm --filter @chokh/tracker build

      - run: pnpm --filter @chokh/react exec playwright install --with-deps chromium

      - run: pnpm --filter @chokh/react test:e2e

  dashboard-e2e:
    name: dashboard smoke and accessibility in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite runs against dist and against the real server: what is proved
      # is what a person is served, by the process that serves it. A bundle that
      # splits wrongly, a font that does not load, a route the static host
      # cannot answer, an envelope nobody parses the same way and a stream that
      # never reaches the page are all invisible to a per-package test.
      #
      # Every package, not the three this job names: the server imports the geo
      # reader and the MongoDB adapter, and a job that builds only what it
      # thinks it needs fails at the first import of what it forgot.
      - run: pnpm build

      - run: pnpm --filter @chokh/dashboard exec playwright install --with-deps chromium

      # CI is set on every GitHub runner, and the Playwright config reads it:
      # a server started here is never reused, so nothing stale is audited in
      # place of this build.
      - run: pnpm --filter @chokh/dashboard run test:e2e

      # Accessibility is audited rather than asserted, on both reports in both
      # palettes, and the run fails unless every one of them scores 1 having
      # audited a page that actually had the dashboard in it.
      - run: pnpm --filter @chokh/dashboard run a11y

      - name: The audit, whatever it said
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-accessibility
          path: packages/dashboard/lighthouse/accessibility.json
          if-no-files-found: warn

  # The product the way a person runs it, on each database it runs on: the
  # default file, which is PostgreSQL, and the MongoDB file. Up from nothing,
  # a pageview in and out, down and up again with the rows still there, and
  # told to stop with the database present and with it gone.
  compose:
    name: docker compose up on ${{ matrix.store }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: postgres
            file: docker-compose.yml
            database: postgres
          - store: mongodb
            file: docker-compose.mongodb.yml
            database: mongo
    env:
      # Every `docker compose` below reads this, so no step can forget which
      # stack it is talking to.
      COMPOSE_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4

      # No variable set and no file edited first: what the README's one line
      # does on a machine that has never seen the product.
      - name: Start the stack from nothing
        run: docker compose up --build -d

      - name: Wait for the image HEALTHCHECK to report healthy
        run: |
          container="$(docker compose ps -q server)"
          status=unknown
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            if [ "${status}" = "healthy" ]; then
              echo "server healthy on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "server never reported healthy within 120 seconds, last status: ${status}"
          exit 1

      - name: Assert GET /health answers with the success envelope
        run: |
          body="$(curl -fs http://localhost:4100/health)"
          echo "${body}"
          grep -q '"success":true' <<< "${body}"
          logs="$(docker compose logs --no-color server)"
          grep -m1 '"store":"${{ matrix.store }}"' <<< "${logs}"

      # As it ships the stack is for this machine alone: every published port
      # is on the loopback address, and the PostgreSQL of the default file is
      # not published at all.
      - name: Nothing is published beyond this machine
        run: |
          set -e
          published="$(docker ps --filter "label=com.docker.compose.project=chokh" --format '{{.Names}} {{.Ports}}')"
          echo "${published}"
          if grep -E '(0\.0\.0\.0|\[::\]|:::)[^ ,]*->' <<< "${published}"; then
            echo "a port is published on every address"
            exit 1
          fi
          grep -q '127\.0\.0\.1:4100->4100' <<< "${published}"
          if [ "${{ matrix.store }}" = "postgres" ] && grep -E -- '->5432' <<< "${published}"; then
            echo "PostgreSQL is published"
            exit 1
          fi

      # The image can run on PostgreSQL, so it carries the driver. It must not
      # carry a PostgreSQL server: the adapter's tests bring one of their own
      # (embedded-postgres, sixty megabytes of binaries), and a dev dependency
      # that reached the runtime stage would ship in every install.
      - name: The image carries the driver and no PostgreSQL server
        run: |
          set -e
          found="$(docker compose exec -T server sh -c "find / -xdev \\( -name '*embedded-postgres*' -o -type f \\( -name initdb -o -name pg_ctl -o -name postgres \\) \\) 2>/dev/null" || true)"
          echo "PostgreSQL server files in the image: ${found:-none}"
          [ -z "${found}" ]
          docker compose exec -T server sh -c "ls node_modules/.pnpm | grep -E '^pg@'"
          docker compose exec -T server sh -c "test -f packages/store-postgres/dist/index.js"
          docker image inspect "$(docker compose images -q server)" --format 'image size: {{.Size}} bytes'

      # Nobody ran a migration by hand: the one-shot service did, before the
      # server was allowed to start.
      - name: The migrate service ran, and migrate --verify-only reports missing 0
        if: matrix.store == 'postgres'
        run: |
          set -e
          code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")"
          echo "the migrate service exited ${code}"
          [ "${code}" = "0" ]
          docker compose logs --no-color migrate | tail -n 3
          report="$(docker compose exec -T server node packages/store-postgres/dist/migrate.js --verify-only)"
          echo "${report}" | tail -n 1
          grep -q 'tables: 16, indexes: 31 present of 31, missing: 0, unexpected: 0' <<< "${report}"

      - name: Apply the index migration against the real MongoDB
        if: matrix.store == 'mongodb'
        run: docker compose exec -T server node packages/store-mongo/dist/migrate.js --apply

      - name: Assert migrate --verify-only reports missing 0
        if: matrix.store == 'mongodb'
        run: |
          report="$(docker compose exec -T server node packages/store-mongo/dist/migrate.js --verify-only)"
          echo "${report}"
          grep -q 'missing: 0' <<< "${report}"
          # The people directory's index (AN-PPL02) is the fourth on visitors.
          grep -Eq 'visitors +indexes 4/4' <<< "${report}"
          # The health reads' index (AN-VIT01) is the sixth on events.
          grep -Eq 'events +indexes 6/6' <<< "${report}"

      # The README's own first steps: the first account, a site, and then what
      # the script on a page would send. The session cookie is carried by hand
      # because it is a Secure one and this is plain HTTP. The pageview says it
      # comes from a browser: sent as curl it is stored and marked as a bot,
      # which is right, and no report counts it.
      - name: Register, create a site, collect a pageview and read it back
        run: |
          set -e
          session="$(curl -fs -o /dev/null -D - -X POST http://localhost:4100/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"a-long-enough-password"}' \
            | tr -d '\r' | sed -n 's/^[Ss]et-[Cc]ookie: \([^;]*\).*/\1/p' | paste -sd ';' -)"
          [ -n "${session}" ]
          curl -fs -X POST http://localhost:4100/api/sites \
            -H "cookie: ${session}" -H 'content-type: application/json' \
            -d '{"id":"ci_site","name":"CI","domains":["example.com"],"settings":{"timezone":"Asia/Dhaka"}}' > /dev/null
          now="$(($(date +%s) * 1000))"
          curl -fs -X POST http://localhost:4100/api/collect \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36' \
            -H 'content-type: text/plain' -H 'origin: https://example.com' \
            -d "{\"siteId\":\"ci_site\",\"sentAt\":${now},\"hostname\":\"example.com\",\"visitorId\":\"v_ci\",\"lang\":\"en\",\"screen\":\"1440x900\",\"events\":[{\"type\":\"pageview\",\"ts\":$((now - 1000)),\"path\":\"/pricing\"}]}"
          echo
          echo "SESSION=${session}" >> "${GITHUB_ENV}"
          echo "READ=http://localhost:4100/api/sites/ci_site/stats/aggregate?from=$((now - 3600000))&to=$((now + 600000))" >> "${GITHUB_ENV}"
          answer="$(curl -fs -H "cookie: ${session}" "http://localhost:4100/api/sites/ci_site/stats/aggregate?from=$((now - 3600000))&to=$((now + 600000))")"
          echo "${answer}"
          grep -q '"pageviews":1' <<< "${answer}"

      # Down and up again, without -v: the containers go and the volumes stay,
      # which is every upgrade and every reboot. The account, its session, the
      # site and the pageview are all still there, and on PostgreSQL the
      # migration has run a second time and created nothing.
      - name: Down and up again, and the pageview is still there
        run: |
          set -e
          docker compose down
          docker compose up -d
          container="$(docker compose ps -q server)"
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = "healthy" ]; then break; fi
            sleep 2
          done
          answer="$(curl -fs -H "cookie: ${SESSION}" "${READ}")"
          echo "${answer}"
          grep -q '"pageviews":1' <<< "${answer}"
          if [ "${{ matrix.store }}" = "postgres" ]; then
            code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")"
            echo "the migrate service exited ${code} the second time"
            [ "${code}" = "0" ]
          fi

      # `docker compose stop` sends SIGTERM and kills after the time it is
      # given. A server that stopped by itself exits 0; one that had to be
      # killed exits 137, and one the signal ended exits 143.
      - name: Told to stop, the server exits by itself, with the database present and with it gone
        run: |
          set -e
          container="$(docker compose ps -q server)"
          stopped() {
            docker compose stop -t 30 server
            code="$(docker inspect --format '{{.State.ExitCode}}' "${container}")"
            echo "the server exited ${code} with the database $1"
            [ "${code}" = "0" ]
          }
          stopped present

          docker compose start server
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "${container}")" = "healthy" ]; then break; fi
            sleep 2
          done
          curl -fs -H "cookie: ${SESSION}" "${READ}" > /dev/null
          docker compose stop ${{ matrix.database }}
          stopped gone

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
