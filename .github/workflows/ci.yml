name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, typecheck, lint, test, tracker size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: pnpm size:tracker

  compose:
    name: docker compose serves GET /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the image HEALTHCHECK to report healthy
        run: |
          container="$(docker compose ps -q server)"
          status=unknown
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container}")"
            if [ "${status}" = "healthy" ]; then
              echo "server healthy on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "server never reported healthy within 120 seconds, last status: ${status}"
          exit 1

      - name: Assert GET /health answers with the success envelope
        run: |
          body="$(curl -fs http://localhost:4100/health)"
          echo "${body}"
          echo "${body}" | grep -q '"success":true'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
