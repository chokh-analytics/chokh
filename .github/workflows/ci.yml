name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, typecheck, lint, test, tracker size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: pnpm size:tracker

  compose:
    name: docker compose serves GET /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the server to answer
        run: |
          for attempt in $(seq 1 60); do
            if curl -fs http://localhost:4100/health > /dev/null; then
              echo "server answered on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "server did not answer within 120 seconds"
          exit 1

      - name: Assert the health envelope
        run: |
          body=$(curl -fs http://localhost:4100/health)
          echo "${body}"
          echo "${body}" | grep -q '"success":true'

      - name: Container health reported by the image HEALTHCHECK
        run: docker inspect --format '{{.Name}} {{.State.Health.Status}}' "$(docker compose ps -q server)"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
