# The whole product on one machine, on MongoDB instead of PostgreSQL: the
# server, MongoDB and Redis.
#
#   docker compose -f docker-compose.mongodb.yml up
#
# This was docker-compose.yml until PostgreSQL became the default, and it keeps
# the same project name and the same volume names on purpose: an install that
# was started from the old default has its rows in the `mongo-data` volume, and
# this is the file that reads it. Nothing copies those rows into PostgreSQL
# (README.md, "If you ran the default before it was PostgreSQL").
#
# As it ships, nothing here is reachable from another machine: every port is
# published on this machine's loopback address only. The session secret below
# is a development value that anybody reading this repository has. README.md,
# "Before anybody else can reach it", says what to change first.
name: chokh

services:
  server:
    build: .
    image: chokh:local
    restart: unless-stopped
    # On this machine only. Put a TLS-terminating proxy in front and leave this
    # as it is, or set CHOKH_PUBLISH (for example to 0.0.0.0:4100) once the
    # session secret below is your own.
    ports:
      - '${CHOKH_PUBLISH:-127.0.0.1:4100}:4100'
    environment:
      HOST: 0.0.0.0
      PORT: '4100'
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/chokh
      REDIS_URL: redis://redis:6379
      # What the dashboard session cookie is signed with. The image runs with
      # NODE_ENV=production, which refuses to start without one, and the value below
      # is a placeholder so that `docker compose up` works on a laptop. It is not a
      # secret: anybody reading this repository has it. Set SESSION_SECRET in your
      # environment before this is reachable by anybody else, or every session cookie
      # it ever signs is forgeable.
      SESSION_SECRET: ${SESSION_SECRET:-a-development-only-session-secret-change-me}
      # Unset means POST /api/sso refuses every exchange, which is the right default.
      # Set it to the secret shared with whatever application mints the tokens.
      SSO_SECRET: ${SSO_SECRET:-}
      # Unset means the keyless DB-IP Lite database. Set it to a MaxMind
      # license key to read GeoLite2-City instead.
      GEOIP_LICENSE_KEY: ${GEOIP_LICENSE_KEY:-}
      # Chokh Pro. The key turns the paid features on; the other four say where
      # alerts go and are read by packages/ee alone. All unset is a complete
      # install of the free product.
      CHOKH_LICENSE_KEY: ${CHOKH_LICENSE_KEY:-}
      CHOKH_SMTP_URL: ${CHOKH_SMTP_URL:-}
      CHOKH_BREVO_API_KEY: ${CHOKH_BREVO_API_KEY:-}
      CHOKH_MAIL_FROM: ${CHOKH_MAIL_FROM:-}
      CHOKH_TELEGRAM_BOT_TOKEN: ${CHOKH_TELEGRAM_BOT_TOKEN:-}
      CHOKH_PUBLIC_URL: ${CHOKH_PUBLIC_URL:-}
    volumes:
      - geo-data:/app/data/geo
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # No password: it listens on this machine's loopback address and on the
  # network compose makes for the server, and nowhere else. Do not publish it
  # more widely without turning authentication on.
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  geo-data:
