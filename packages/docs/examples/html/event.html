<!-- A click on an element with data-pa-event is an event, with each
     data-pa-prop-<name> as a property. -->
<button data-pa-event="signup" data-pa-prop-plan="pro">Sign up</button>

<!-- Or from your own code, once the tag has loaded. -->
<script>
  pa('event', 'quiz_start', { quizId: 'q1' });
</script>
