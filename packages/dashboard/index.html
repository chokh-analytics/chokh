<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chokh</title>
    <meta name="description" content="Open source, first-party web analytics." />
    <!-- Nothing here is indexable and nothing here belongs to anybody but the
         person signed in, so no crawler is invited. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      /*
       * The theme, before the first paint.
       *
       * Without this a person who chose dark sees a white page for as long as
       * the bundle takes to parse, which on a slow connection is a second of
       * flash on every navigation. Six lines inline is the whole fix, and it
       * runs before the stylesheet has anything to apply.
       *
       * A choice of "system" takes the attribute off rather than writing the
       * resolved name, so the media query keeps deciding and a machine that
       * switches at sunset follows without a reload. The same rule is in
       * src/theme/theme.ts, where the toggle and the tests read it.
       */
      try {
        var choice = localStorage.getItem('chokh:theme');
        if (choice === 'light' || choice === 'dark') {
          document.documentElement.setAttribute('data-theme', choice);
        }
      } catch (error) {
        /* A private window has no storage. The system preference still works. */
      }
      /*
       * An invitation link, taken out of the address bar before anything else.
       *
       * The link is /invite#<token>, and the token is in the fragment so that
       * no server ever sees it. This takes it out of the address bar and the
       * history before a single module has been fetched, and parks it where
       * src/lib/invite-token.ts collects it and clears it. After that it is
       * in that module's memory and nowhere else: not in the URL, not in any
       * storage. replaceState and not a navigation, so nothing reloads and
       * the back button does not lead to the link.
       */
      try {
        if (location.pathname === '/invite' && location.hash.length > 1) {
          window.__chokhInvite = location.hash.slice(1);
          history.replaceState(null, '', '/invite');
        }
      } catch (error) {
        /* The module takes the same step when it loads. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
